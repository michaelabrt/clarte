name: 'Clarte Architecture Review'
description: 'Reviews pull requests for missing co-changes, chokepoints, flow bottlenecks and tight coupling'
author: 'Michael Aboukrat'

branding:
  icon: 'git-pull-request'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true
    default: ${{ github.token }}

  working-directory:
    description: 'Path to the project root (default: repository root)'
    required: false
    default: '.'

  comment-mode:
    description: 'How to handle PR comments: create, update, or none'
    required: false
    default: 'update'

  max-files:
    description: 'Maximum number of changed files to analyze (0 = unlimited)'
    required: false
    default: '50'

outputs:
  has-findings:
    description: 'Whether any architectural findings were detected'

  co-change-count:
    description: 'Number of missing co-change warnings'

  comment-id:
    description: 'ID of the posted/updated PR comment'

  analysis-json:
    description: 'Full analysis result as JSON string'

runs:
  using: 'node24'
  main: 'dist/index.js'
