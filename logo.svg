<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Black circle background, slightly larger than outer ring -->
  <circle cx="200" cy="200" r="168" fill="#0d1117"/>

  <!-- White logo rings -->
  <g fill="none" stroke="#fff" stroke-linecap="butt">
    <!-- Inner ring: C shape, gap on right -->
    <path d="M 246 238.6 A 60 60 0 1 1 246 161.4" stroke-width="20"/>

    <!-- Middle ring: gap at left, hook at start -->
    <path d="M 128.7 150.0 L 114.0 139.7 A 105 105 0 1 1 104.8 244.4" stroke-width="16"/>

    <!-- Dead-end spur: branches outward from middle ring into outer wall -->
    <path d="M 218.2 303.4 L 224.7 339.8" stroke-width="16"/>

    <!-- Outer ring: gap at upper-right, hook at start -->
    <path d="M 324.1 154.9 L 341.0 148.7 A 150 150 0 1 1 238.8 55.1" stroke-width="16"/>
  </g>
</svg>
