<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Black circle background, no border -->
  <circle cx="200" cy="200" r="158" fill="#000"/>

  <!-- Outer ring grey border (wider stroke behind the white one) -->
  <path d="M 85.7 266 L 70.1 275 A 150 150 0 1 1 200 350"
        fill="none" stroke="#555" stroke-width="22" stroke-linecap="butt"/>

  <!-- White logo rings -->
  <g fill="none" stroke="#fff" stroke-linecap="butt">
    <!-- Inner ring: C shape, gap on right -->
    <path d="M 246 238.6 A 60 60 0 1 1 246 161.4" stroke-width="20"/>

    <!-- Middle ring: gap at upper-right, hook at start -->
    <path d="M 287 200 L 305 200 A 105 105 0 1 1 252.5 109.1" stroke-width="16"/>

    <!-- Outer ring: acts as circle border, gap at left-bottom -->
    <path d="M 85.7 266 L 70.1 275 A 150 150 0 1 1 200 350" stroke-width="16"/>
  </g>
</svg>
