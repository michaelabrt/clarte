name: Architecture Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 fetches full git history, needed for
      # change coupling analysis and git-based risk scoring
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./action
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-critical: 'true'
